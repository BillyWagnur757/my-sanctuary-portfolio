<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillyWagnur Bird Sanctuary</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #172d22;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud, .status {
      position: absolute;
      border: 1px solid rgba(220, 239, 209, .4);
      border-radius: 14px;
      background: rgba(15, 36, 27, .84);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .hud {
      top: 16px;
      left: 16px;
      max-width: calc(100% - 32px);
      padding: 12px 16px;
    }

    .hud h1 {
      margin: 0 0 4px;
      color: #d3e9b9;
      font-size: 1rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hud p {
      margin: 0;
      font-size: .82rem;
    }

    .status {
      top: 16px;
      right: 16px;
      max-width: 290px;
      padding: 10px 14px;
      font-size: .82rem;
    }

    .controls {
      position: absolute;
      right: 16px;
      bottom: 18px;
      display: none;
      width: 144px;
      height: 144px;
      touch-action: none;
    }

    .control-btn {
      position: absolute;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(230, 242, 217, .7);
      border-radius: 12px;
      background: rgba(37, 72, 52, .9);
      color: white;
      font: inherit;
      font-size: 1.1rem;
      user-select: none;
      touch-action: none;
    }

    .control-btn.active { background: #668451; }
    .control-btn[data-dir="up"] { top: 0; left: 50px; }
    .control-btn[data-dir="down"] { bottom: 0; left: 50px; }
    .control-btn[data-dir="left"] { top: 50px; left: 0; }
    .control-btn[data-dir="right"] { top: 50px; right: 0; }

    .control-btn[data-dir="jump"] {
      top: 50px;
      left: 50px;
      border-radius: 50%;
      background: rgba(117, 91, 56, .94);
    }

    @media (max-width: 650px) {
      .controls { display: block; }
      .hud { top: 10px; left: 10px; padding: 10px 12px; }
      .hud h1 { font-size: .88rem; }
      .hud p { max-width: 245px; font-size: .72rem; }
      .status {
        top: 88px;
        right: 10px;
        max-width: 55%;
        padding: 8px 10px;
        font-size: .72rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main id="scene">
    <canvas id="world" aria-label="Bird sanctuary. Move and jump into a destination emblem to visit it."></canvas>

    <header class="hud">
      <h1>BillyWagnur Sanctuary</h1>
      <p>WASD / arrows to move • Space to jump • Touch an emblem to visit</p>
    </header>

    <div class="status" id="status" aria-live="polite">
      Explore the sanctuary and find a destination
    </div>

    <div class="controls" aria-label="Touch controls">
      <button class="control-btn" data-dir="up" aria-label="Move up">▲</button>
      <button class="control-btn" data-dir="left" aria-label="Move left">◀</button>
      <button class="control-btn" data-dir="jump" aria-label="Jump">●</button>
      <button class="control-btn" data-dir="right" aria-label="Move right">▶</button>
      <button class="control-btn" data-dir="down" aria-label="Move down">▼</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    const destinations = {
      youtube: "https://www.youtube.com/@NemoBilly757",
      spotify: "https://open.spotify.com/artist/4zVX7y6mrklcuGHDJjZ12e?si=gbSGtZBuQjWSURHQCDtU3g",
      applemusic: "https://music.apple.com/us/artist/billywagnur/1584479650",
      tiktok: "https://www.tiktok.com/@baggettball"
    };

    // Keep avatar.png, aye.mp3, uh.mp3, and stupidsong.m4a
    // in the same folder as this index.html file.
    const avatar = new Image();
    avatar.src = "./avatar.png";

    const decisionSound = new Audio("./aye.mp3");
    decisionSound.preload = "auto";

    const jumpSound = new Audio("./uh.mp3");
    jumpSound.preload = "auto";

    const backgroundMusic = new Audio("./stupidsong.m4a");
    backgroundMusic.loop = true;
    backgroundMusic.volume = 0.35;
    backgroundMusic.preload = "auto";

    function startMusic() {
      backgroundMusic.play().catch(() => {
        // Most browsers wait for the visitor's first interaction before playing audio.
      });
    }

    startMusic();
    window.addEventListener("pointerdown", startMusic, { once: true });
    window.addEventListener("keydown", startMusic, { once: true });

    // The emblems are deliberately farther up the sanctuary path.
    const stations = [
      { id: "youtube", label: "YouTube", icon: "▶", color: "#f07862", x: .15, y: .57 },
      { id: "spotify", label: "Spotify", icon: "♫", color: "#a9cf83", x: .38, y: .52 },
      { id: "applemusic", label: "Apple Music", icon: "♫", color: "#efa0a6", x: .62, y: .52 },
      { id: "tiktok", label: "TikTok", icon: "♪", color: "#8bd5ce", x: .85, y: .57 }
    ];

    // Collision obstacles. Jump over them or steer around them.
    const obstacles = [
      { type: "rock",  x: .18, y: .78, w: .075, h: .055, blockW: .055, blockH: .045, height: 27 },
      { type: "log",   x: .36, y: .72, w: .16,  h: .060, blockW: .14,  blockH: .05,  height: 30 },
      { type: "stump", x: .55, y: .78, w: .070, h: .12,  blockW: .060, blockH: .07,  height: 45 },
      { type: "rock",  x: .73, y: .68, w: .080, h: .060, blockW: .065, blockH: .05,  height: 29 },
      { type: "log",   x: .85, y: .76, w: .14,  h: .055, blockW: .13,  blockH: .045, height: 28 },
      { type: "rock",  x: .28, y: .63, w: .065, h: .050, blockW: .05,  blockH: .04,  height: 23 },
      { type: "stump", x: .47, y: .63, w: .060, h: .10,  blockW: .052, blockH: .06,  height: 39 },
      { type: "rock",  x: .69, y: .59, w: .060, h: .045, blockW: .05,  blockH: .036, height: 22 }
    ];

    // Trees add depth; trunks can also block the character's path.
    const trees = [
      { x: .02, y: .68, scale: 1.20 },
      { x: .10, y: .57, scale: .82 },
      { x: .30, y: .54, scale: .62 },
      { x: .71, y: .53, scale: .62 },
      { x: .91, y: .57, scale: .84 },
      { x: .99, y: .68, scale: 1.22 }
    ];

    const birds = Array.from({ length: 10 }, (_, i) => ({
      x: Math.random(),
      y: .12 + Math.random() * .25,
      speed: .014 + Math.random() * .025,
      phase: Math.random() * Math.PI * 2,
      size: 3 + Math.random() * 3,
      direction: i % 2 ? 1 : -1
    }));

    const player = {
      x: 0,
      y: 0,
      jumpZ: 0,
      jumpVelocity: 0,
      facing: 1,
      grounded: true
    };

    const keys = new Set();

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let previousTime = 0;
    let activated = false;
    let activationTimer = null;

    function groundY() {
      return height * .88;
    }

    // The avatar appears smaller farther up the path.
    function getPlayerScale() {
      const near = height * .88;
      const far = height * .48;
      const depth = Math.max(0, Math.min(1, (player.y - far) / (near - far)));
      return .34 + depth * .66;
    }

    function getAvatarDimensions() {
      const scale = getPlayerScale();
      const baseHeight = Math.min(height * .22, 175);
      const spriteHeight = baseHeight * scale;
      const aspect = avatar.naturalWidth && avatar.naturalHeight
        ? avatar.naturalWidth / avatar.naturalHeight
        : .72;

      return {
        width: spriteHeight * aspect,
        height: spriteHeight
      };
    }

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      if (!player.x) {
        player.x = width * .5;
        player.y = groundY();
        player.grounded = true;
      } else {
        player.x = Math.min(width - 18, player.x);
        player.y = Math.min(groundY(), Math.max(height * .48, player.y));
      }
    }

    window.addEventListener("resize", resize);
    resize();

    function playSound(sound) {
      sound.currentTime = 0;
      sound.play().catch(error => {
        console.warn(`Could not play ${sound.src}:`, error);
      });
    }

    function jump() {
      if (activated || !player.grounded) return;

      player.jumpVelocity = Math.max(430, height * .78);
      player.grounded = false;
      playSound(jumpSound);
    }

    function obstacleRect(obstacle) {
      return {
        x: width * obstacle.x,
        y: height * obstacle.y,
        w: width * obstacle.blockW,
        h: height * obstacle.blockH
      };
    }

    function collidesWithObstacle(x, y) {
      const playerRadius = Math.max(7, getAvatarDimensions().width * .11);

      for (const obstacle of obstacles) {
        // While high enough in the jump, the avatar can clear the obstacle.
        if (player.jumpZ > obstacle.height) continue;

        const rect = obstacleRect(obstacle);
        const left = rect.x - rect.w / 2;
        const right = rect.x + rect.w / 2;
        const top = rect.y - rect.h / 2;
        const bottom = rect.y + rect.h / 2;

        const closestX = Math.max(left, Math.min(x, right));
        const closestY = Math.max(top, Math.min(y, bottom));
        const dx = x - closestX;
        const dy = y - closestY;

        if (dx * dx + dy * dy < playerRadius * playerRadius) {
          return true;
        }
      }

      // Tree trunks in the playable area also block movement.
      for (const tree of trees) {
        if (tree.x < .13 || tree.x > .87) continue;

        const tx = width * tree.x;
        const ty = height * tree.y;
        const trunkRadius = 7 * tree.scale;
        const playerRadius = Math.max(7, getAvatarDimensions().width * .10);

        if (Math.hypot(x - tx, y - ty) < trunkRadius + playerRadius) {
          return true;
        }
      }

      return false;
    }

    function movePlayer(dx, dy) {
      const nextX = Math.max(14, Math.min(width - 14, player.x + dx));
      if (!collidesWithObstacle(nextX, player.y)) {
        player.x = nextX;
      }

      const nextY = Math.max(height * .48, Math.min(groundY(), player.y + dy));
      if (!collidesWithObstacle(player.x, nextY)) {
        player.y = nextY;
      }
    }

    function activateStation(station) {
      if (activated) return;

      activated = true;
      keys.clear();
      statusEl.textContent = `Opening ${station.label}…`;
      playSound(decisionSound);

      activationTimer = setTimeout(() => {
        window.location.href = destinations[station.id];
      }, 400);
    }

    function checkEmblemTouch() {
      if (activated) return;

      const dimensions = getAvatarDimensions();
      const avatarCenterX = player.x;
      const avatarCenterY = player.y - player.jumpZ - dimensions.height * .52;

      for (const station of stations) {
        const stationX = width * station.x;
        const stationGroundY = height * station.y;
        const emblemRadius = Math.max(17, Math.min(24, height * .032));
        const emblemY = stationGroundY - emblemRadius - 10;

        // A little tolerance makes touching the visible avatar/emblem feel natural.
        const touchX = emblemRadius + dimensions.width * .28;
        const touchY = emblemRadius + dimensions.height * .34;

        if (
          Math.abs(avatarCenterX - stationX) < touchX &&
          Math.abs(avatarCenterY - emblemY) < touchY
        ) {
          activateStation(station);
          return;
        }
      }
    }

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#8daea5");
      sky.addColorStop(.28, "#b8c5a5");
      sky.addColorStop(.49, "#82946b");
      sky.addColorStop(1, "#1c3424");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      const sunlight = ctx.createRadialGradient(
        width * .53, height * .19, 2,
        width * .53, height * .19, height * .62
      );
      sunlight.addColorStop(0, "rgba(255, 234, 176, .48)");
      sunlight.addColorStop(.35, "rgba(244, 224, 169, .15)");
      sunlight.addColorStop(1, "rgba(244, 224, 169, 0)");
      ctx.fillStyle = sunlight;
      ctx.fillRect(0, 0, width, height);

      // Distant hills.
      ctx.fillStyle = "#81916c";
      ctx.beginPath();
      ctx.moveTo(0, height * .43);
      ctx.quadraticCurveTo(width * .18, height * .29, width * .39, height * .42);
      ctx.quadraticCurveTo(width * .69, height * .24, width, height * .40);
      ctx.lineTo(width, height * .62);
      ctx.lineTo(0, height * .62);
      ctx.closePath();
      ctx.fill();

      // Nearer hill layer.
      ctx.fillStyle = "#5b7655";
      ctx.beginPath();
      ctx.moveTo(0, height * .49);
      ctx.quadraticCurveTo(width * .20, height * .38, width * .43, height * .49);
      ctx.quadraticCurveTo(width * .74, height * .34, width, height * .47);
      ctx.lineTo(width, height * .68);
      ctx.lineTo(0, height * .68);
      ctx.closePath();
      ctx.fill();

      // Pond and bank.
      ctx.fillStyle = "#354f3c";
      ctx.beginPath();
      ctx.ellipse(width * .12, height * .62, width * .23, height * .105, -.06, 0, Math.PI * 2);
      ctx.fill();

      const water = ctx.createLinearGradient(0, height * .54, 0, height * .68);
      water.addColorStop(0, "#83a99b");
      water.addColorStop(.55, "#527d77");
      water.addColorStop(1, "#315953");
      ctx.fillStyle = water;
      ctx.beginPath();
      ctx.ellipse(width * .12, height * .61, width * .205, height * .077, -.06, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(233, 241, 212, .4)";
      ctx.lineWidth = 1;
      for (let i = 0; i < 8; i++) {
        const x = width * (.02 + i * .027);
        const y = height * (.58 + (i % 3) * .022);
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.quadraticCurveTo(x + 10, y - 2, x + 22, y);
        ctx.stroke();
      }

      // Forest floor.
      const ground = ctx.createLinearGradient(0, height * .46, 0, height);
      ground.addColorStop(0, "#59744a");
      ground.addColorStop(.36, "#3b5936");
      ground.addColorStop(1, "#172c20");
      ctx.fillStyle = ground;
      ctx.fillRect(0, height * .46, width, height * .54);

      // Perspective trail.
      ctx.fillStyle = "#a49a7a";
      ctx.beginPath();
      ctx.moveTo(width * .475, height * .45);
      ctx.lineTo(width * .525, height * .45);
      ctx.lineTo(width * .89, height);
      ctx.lineTo(width * .11, height);
      ctx.closePath();
      ctx.fill();

      const pathLight = ctx.createLinearGradient(0, height * .46, 0, height);
      pathLight.addColorStop(0, "rgba(240, 224, 183, .28)");
      pathLight.addColorStop(1, "rgba(71, 66, 49, .24)");
      ctx.fillStyle = pathLight;
      ctx.fill();

      // Perspective stones.
      for (let i = 1; i < 22; i++) {
        const t = i / 23;
        const y = height * (.47 + t * .50);
        const x = width * (.5 + Math.sin(i * 4.7) * t * .19);
        const size = Math.max(2, width * (.003 + t * .010));

        ctx.fillStyle = i % 2
          ? "rgba(60, 67, 52, .45)"
          : "rgba(226, 213, 176, .40)";
        ctx.beginPath();
        ctx.ellipse(x, y, size, size * .34, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTree(tree) {
      const x = width * tree.x;
      const ground = height * tree.y;
      const scale = tree.scale;
      const trunkW = 18 * scale;
      const trunkH = height * .29 * scale;
      const top = ground - trunkH;

      const trunk = ctx.createLinearGradient(x - trunkW, 0, x + trunkW, 0);
      trunk.addColorStop(0, "#302d22");
      trunk.addColorStop(.45, "#756044");
      trunk.addColorStop(1, "#302c22");

      ctx.fillStyle = trunk;
      ctx.beginPath();
      ctx.moveTo(x - trunkW * .5, ground);
      ctx.lineTo(x - trunkW * .28, top);
      ctx.lineTo(x + trunkW * .22, top);
      ctx.lineTo(x + trunkW * .65, ground);
      ctx.closePath();
      ctx.fill();

      const leaves = ["#263f2e", "#34553a", "#456643", "#526d46"];
      for (let i = 0; i < 6; i++) {
        ctx.fillStyle = leaves[i % leaves.length];
        ctx.beginPath();
        ctx.ellipse(
          x + (i - 2.5) * 24 * scale,
          top - 28 * scale + Math.sin(i * 2.4) * 12 * scale,
          38 * scale,
          47 * scale,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }

      // Sunlit leaves.
      ctx.fillStyle = "rgba(173, 184, 112, .22)";
      ctx.beginPath();
      ctx.ellipse(x - 25 * scale, top - 54 * scale, 20 * scale, 9 * scale, -.55, 0, Math.PI * 2);
      ctx.ellipse(x + 10 * scale, top - 35 * scale, 16 * scale, 7 * scale, .45, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBirds(time) {
      birds.forEach(bird => {
        const x = (((bird.x + time * bird.speed * bird.direction) % 1) + 1) % 1 * width;
        const y = height * bird.y + Math.sin(time * 2 + bird.phase) * 5;
        const flap = Math.sin(time * 8 + bird.phase) * bird.size;

        ctx.strokeStyle = "rgba(34, 47, 37, .82)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - bird.size, y);
        ctx.quadraticCurveTo(x, y - flap, x + bird.size, y);
        ctx.stroke();
      });
    }

    function drawHill(x, y, w, h, color) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x - w / 2, y + h);
      ctx.quadraticCurveTo(x - w * .38, y + h * .14, x, y);
      ctx.quadraticCurveTo(x + w * .32, y - h * .08, x + w / 2, y + h);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "rgba(171, 190, 119, .34)";
      ctx.lineWidth = Math.max(2, h * .07);
      ctx.beginPath();
      ctx.moveTo(x - w * .28, y + h * .55);
      ctx.quadraticCurveTo(x, y + h * .08, x + w * .28, y + h * .28);
      ctx.stroke();
    }

    function drawObstacle(obstacle) {
      const x = width * obstacle.x;
      const y = height * obstacle.y;
      const w = width * obstacle.w;
      const h = height * obstacle.h;

      // Shadow.
      ctx.fillStyle = "rgba(12, 21, 13, .32)";
      ctx.beginPath();
      ctx.ellipse(x, y + h * .45, w * .62, h * .28, 0, 0, Math.PI * 2);
      ctx.fill();

      if (obstacle.type === "rock") {
        const rock = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y + h);
        rock.addColorStop(0, "#9a9d85");
        rock.addColorStop(.4, "#697362");
        rock.addColorStop(1, "#424f40");
        ctx.fillStyle = rock;
        ctx.beginPath();
        ctx.moveTo(x - w * .5, y + h * .38);
        ctx.lineTo(x - w * .34, y + h * .05);
        ctx.lineTo(x + w * .04, y);
        ctx.lineTo(x + w * .36, y + h * .12);
        ctx.lineTo(x + w * .5, y + h * .52);
        ctx.lineTo(x + w * .34, y + h);
        ctx.lineTo(x - w * .42, y + h);
        ctx.closePath();
        ctx.fill();
      } else if (obstacle.type === "stump") {
        ctx.fillStyle = "#674a31";
        ctx.fillRect(x - w * .38, y + h * .18, w * .76, h * .82);

        const top = ctx.createLinearGradient(x, y, x, y + h * .35);
        top.addColorStop(0, "#b58b58");
        top.addColorStop(1, "#795938");
        ctx.fillStyle = top;
        ctx.beginPath();
        ctx.ellipse(x, y + h * .2, w * .5, h * .19, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(72, 48, 30, .65)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x, y + h * .2, w * .26, h * .09, 0, 0, Math.PI * 2);
        ctx.stroke();
      } else if (obstacle.type === "log") {
        ctx.fillStyle = "#684a31";
        ctx.beginPath();
        ctx.roundRect(x - w / 2, y + h * .18, w, h * .68, h * .32);
        ctx.fill();

        ctx.fillStyle = "#ad8352";
        ctx.beginPath();
        ctx.ellipse(x - w * .45, y + h * .52, h * .24, h * .34, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#60452d";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.ellipse(x - w * .45, y + h * .52, h * .14, h * .21, 0, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawStation(station) {
      const x = width * station.x;
      const groundY = height * station.y;
      const scale = Math.max(.68, Math.min(1, height / 720));
      const radius = 23 * scale;
      const bubbleY = groundY - radius - 10 * scale;

      // Signpost shadow and post.
      ctx.fillStyle = "rgba(12, 22, 14, .3)";
      ctx.beginPath();
      ctx.ellipse(x, groundY + 2, 20 * scale, 6 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#604a32";
      ctx.lineWidth = 5 * scale;
      ctx.beginPath();
      ctx.moveTo(x, bubbleY + radius * .7);
      ctx.lineTo(x, groundY);
      ctx.stroke();

      // Glowing link emblem.
      ctx.shadowColor = station.color;
      ctx.shadowBlur = 16;
      ctx.fillStyle = "#233b2b";
      ctx.strokeStyle = station.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, bubbleY, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = station.color;
      ctx.font = `bold ${20 * scale}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(station.icon, x, bubbleY);

      ctx.font = `600 ${Math.max(10, 11 * scale)}px system-ui`;
      const labelW = Math.max(64 * scale, ctx.measureText(station.label).width + 18);

      ctx.fillStyle = "rgba(20, 37, 26, .9)";
      ctx.beginPath();
      ctx.roundRect(x - labelW / 2, bubbleY + radius + 5, labelW, 20 * scale, 7);
      ctx.fill();

      ctx.fillStyle = "#f3f1df";
      ctx.fillText(station.label, x, bubbleY + radius + 15 * scale);
    }

    function drawCharacter(time) {
      const dimensions = getAvatarDimensions();
      const moving = keys.size > 0;
      const bob = player.grounded && moving ? Math.abs(Math.sin(time * 11)) * 2 : 0;
      const drawY = player.y - player.jumpZ + bob;

      // Ground shadow remains on the path as the avatar jumps.
      const shadowOpacity = Math.max(.10, .34 - player.jumpZ / 700);
      ctx.fillStyle = `rgba(10, 20, 13, ${shadowOpacity})`;
      ctx.beginPath();
      ctx.ellipse(
        player.x,
        player.y + 2,
        Math.max(10, dimensions.width * .24) * (1 + player.jumpZ / 250),
        Math.max(3, dimensions.height * .045),
        0,
        0,
        Math.PI * 2
      );
      ctx.fill();

      if (!avatar.complete || !avatar.naturalWidth) {
        ctx.fillStyle = "#20222b";
        ctx.beginPath();
        ctx.ellipse(
          player.x,
          drawY - dimensions.height * .48,
          dimensions.width * .3,
          dimensions.height * .48,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
        return;
      }

      ctx.save();
      ctx.translate(player.x, drawY);
      ctx.scale(player.facing, 1);
      ctx.drawImage(
        avatar,
        -dimensions.width / 2,
        -dimensions.height,
        dimensions.width,
        dimensions.height
      );
      ctx.restore();
    }

    function drawForeground() {
      ctx.fillStyle = "rgba(10, 27, 16, .78)";

      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, height * .79);
      ctx.quadraticCurveTo(width * .08, height * .81, width * .17, height);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(width, height);
      ctx.lineTo(width, height * .77);
      ctx.quadraticCurveTo(width * .91, height * .82, width * .82, height);
      ctx.closePath();
      ctx.fill();

      const shade = ctx.createRadialGradient(
        width * .5, height * .48, height * .16,
        width * .5, height * .48, Math.max(width, height) * .76
      );
      shade.addColorStop(0, "rgba(0,0,0,0)");
      shade.addColorStop(1, "rgba(5,15,9,.38)");
      ctx.fillStyle = shade;
      ctx.fillRect(0, 0, width, height);
    }

    function update(delta) {
      if (activated) return;

      let dx = 0;
      let dy = 0;

      if (keys.has("left")) dx -= 1;
      if (keys.has("right")) dx += 1;
      if (keys.has("up")) dy -= 1;
      if (keys.has("down")) dy += 1;

      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        const speed = 190 * delta;
        movePlayer(dx / length * speed, dy / length * speed);

        if (dx) player.facing = dx < 0 ? -1 : 1;
      }

      if (!player.grounded) {
        player.jumpVelocity -= Math.max(1000, height * 1.8) * delta;
        player.jumpZ += player.jumpVelocity * delta;

        if (player.jumpZ <= 0) {
          player.jumpZ = 0;
          player.jumpVelocity = 0;
          player.grounded = true;
        }
      }

      checkEmblemTouch();
    }

    function drawWorld(time) {
      drawBackground();
      drawBirds(time);

      // Distant hills behind the closer forest.
      drawHill(width * .19, height * .48, width * .30, height * .13, "#496444");
      drawHill(width * .83, height * .47, width * .34, height * .16, "#3e5b3b");

      const depthObjects = [];

      trees.forEach(tree => {
        depthObjects.push({
          y: height * tree.y,
          draw: () => drawTree(tree)
        });
      });

      stations.forEach(station => {
        depthObjects.push({
          y: height * station.y,
          draw: () => drawStation(station)
        });
      });

      obstacles.forEach(obstacle => {
        depthObjects.push({
          y: height * obstacle.y,
          draw: () => drawObstacle(obstacle)
        });
      });

      depthObjects.sort((a, b) => a.y - b.y);

      let playerDrawn = false;
      for (const object of depthObjects) {
        if (!playerDrawn && object.y > player.y) {
          drawCharacter(time);
          playerDrawn = true;
        }
        object.draw();
      }

      if (!playerDrawn) drawCharacter(time);
      drawForeground();
    }

    const keyDirections = {
      ArrowLeft: "left", KeyA: "left",
      ArrowRight: "right", KeyD: "right",
      ArrowUp: "up", KeyW: "up",
      ArrowDown: "down", KeyS: "down"
    };

    window.addEventListener("keydown", event => {
      if (event.code === "Space") {
        event.preventDefault();
        if (!event.repeat) jump();
        return;
      }

      const direction = keyDirections[event.code];
      if (!direction) return;

      event.preventDefault();
      keys.add(direction);
    });

    window.addEventListener("keyup", event => {
      const direction = keyDirections[event.code];
      if (direction) keys.delete(direction);
    });

    window.addEventListener("blur", () => keys.clear());

    document.querySelectorAll(".control-btn").forEach(button => {
      const direction = button.dataset.dir;

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        button.classList.add("active");
        button.setPointerCapture(event.pointerId);

        if (direction === "jump") {
          jump();
        } else {
          keys.add(direction);
        }
      });

      const stop = event => {
        event.preventDefault();
        button.classList.remove("active");
        if (direction !== "jump") keys.delete(direction);
      };

      button.addEventListener("pointerup", stop);
      button.addEventListener("pointercancel", stop);
      button.addEventListener("lostpointercapture", stop);
    });

    let previousTime = 0;

    function frame(timeMs) {
      const time = timeMs / 1000;
      const delta = Math.min(.04, previousTime ? (timeMs - previousTime) / 1000 : 0);
      previousTime = timeMs;

      update(delta);
      drawWorld(time);
      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
