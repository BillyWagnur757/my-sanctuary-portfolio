<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillyWagnur Bird Sanctuary</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #193322;
      color: white;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #scene {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background: linear-gradient(#9bb5a1, #385c3b 52%, #183021);
      touch-action: none;
    }

    canvas {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud, .status {
      position: absolute;
      z-index: 2;
      border: 1px solid rgba(220, 239, 209, .55);
      border-radius: 14px;
      background: rgba(15, 36, 27, .9);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .35);
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .hud {
      top: 16px;
      left: 16px;
      max-width: min(390px, calc(100% - 32px));
      padding: 12px 16px;
    }

    .hud h1 {
      margin: 0 0 4px;
      color: #d3e9b9;
      font-size: 1rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hud p {
      margin: 0;
      font-size: .82rem;
      line-height: 1.4;
    }

    .status {
      top: 16px;
      right: 16px;
      max-width: 290px;
      padding: 10px 14px;
      font-size: .82rem;
    }

    .controls {
      position: absolute;
      z-index: 3;
      right: 14px;
      bottom: 14px;
      display: none;
      width: 148px;
      height: 148px;
      touch-action: none;
    }

    .control-btn {
      position: absolute;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(230, 242, 217, .8);
      border-radius: 12px;
      background: rgba(37, 72, 52, .96);
      color: white;
      font: inherit;
      font-size: 1.1rem;
      user-select: none;
      touch-action: none;
    }

    .control-btn.active { background: #668451; }
    .control-btn[data-dir="up"] { top: 0; left: 52px; }
    .control-btn[data-dir="down"] { bottom: 0; left: 52px; }
    .control-btn[data-dir="left"] { top: 52px; left: 0; }
    .control-btn[data-dir="right"] { top: 52px; right: 0; }

    .control-btn[data-dir="jump"] {
      top: 52px;
      left: 52px;
      border-radius: 50%;
      background: #755b38;
    }

    @media (max-width: 650px) {
      .controls { display: block; }
      .hud { top: 10px; left: 10px; padding: 10px 12px; }
      .hud h1 { font-size: .88rem; }
      .hud p { max-width: 250px; font-size: .72rem; }
      .status {
        top: 92px;
        right: 10px;
        max-width: 55%;
        padding: 8px 10px;
        font-size: .72rem;
      }
    }
  </style>
</head>
<body>
  <main id="scene">
    <canvas id="world" aria-label="Bird sanctuary. Move and jump into a destination emblem to visit it."></canvas>

    <header class="hud">
      <h1>BillyWagnur Sanctuary</h1>
      <p>WASD / arrow keys to move • Space to jump • Touch an emblem to visit</p>
    </header>

    <div class="status" id="status" aria-live="polite">
      Explore the sanctuary and find a destination
    </div>

    <div class="controls" aria-label="Touch controls">
      <button class="control-btn" data-dir="up" aria-label="Move up">▲</button>
      <button class="control-btn" data-dir="left" aria-label="Move left">◀</button>
      <button class="control-btn" data-dir="jump" aria-label="Jump">●</button>
      <button class="control-btn" data-dir="right" aria-label="Move right">▶</button>
      <button class="control-btn" data-dir="down" aria-label="Move down">▼</button>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById("world");
      const ctx = canvas.getContext("2d");
      const status = document.getElementById("status");

      if (!ctx) {
        status.textContent = "Your browser could not start the canvas.";
        return;
      }

      const links = {
        youtube: "https://www.youtube.com/@NemoBilly757",
        spotify: "https://open.spotify.com/artist/4zVX7y6mrklcuGHDJjZ12e?si=gbSGtZBuQjWSURHQCDtU3g",
        applemusic: "https://music.apple.com/us/artist/billywagnur/1584479650",
        tiktok: "https://www.tiktok.com/@baggettball"
      };

      const avatar = new Image();
      avatar.src = "./avatar.png";

      const jumpSound = new Audio("./uh.mp3");
      jumpSound.preload = "auto";

      const decisionSound = new Audio("./aye.mp3");
      decisionSound.preload = "auto";

      const music = new Audio("./stupidsong.m4a");
      music.preload = "auto";
      music.loop = true;
      music.volume = 0.35;

      function startMusic() {
        music.play().catch(() => {
          // Browser autoplay rules may require a visitor gesture.
        });
      }

      window.addEventListener("pointerdown", startMusic, { once: true });
      window.addEventListener("keydown", startMusic, { once: true });

      const destinations = [
        { id: "youtube", label: "YouTube", icon: "▶", color: "#ff7666", x: .15, y: .57 },
        { id: "spotify", label: "Spotify", icon: "♫", color: "#a9cf83", x: .38, y: .53 },
        { id: "applemusic", label: "Apple Music", icon: "♫", color: "#efa0a6", x: .62, y: .53 },
        { id: "tiktok", label: "TikTok", icon: "♪", color: "#8bd5ce", x: .85, y: .57 }
      ];

      const obstacles = [
        { type: "rock",  x: .18, y: .79, w: .105, h: .09,  hitW: .075, hitH: .055, height: 34 },
        { type: "log",   x: .36, y: .73, w: .19,  h: .075, hitW: .15,  hitH: .052, height: 36 },
        { type: "stump", x: .56, y: .79, w: .095, h: .15,  hitW: .065, hitH: .082, height: 54 },
        { type: "rock",  x: .78, y: .70, w: .115, h: .09,  hitW: .078, hitH: .058, height: 36 },
        { type: "log",   x: .88, y: .79, w: .18,  h: .075, hitW: .145, hitH: .05, height: 34 },
        { type: "rock",  x: .27, y: .65, w: .09,  h: .072, hitW: .06,  hitH: .045, height: 30 },
        { type: "stump", x: .49, y: .65, w: .078, h: .12,  hitW: .06,  hitH: .07, height: 47 },
        { type: "rock",  x: .70, y: .61, w: .085, h: .068, hitW: .058, hitH: .042, height: 29 },
        { type: "log",   x: .39, y: .58, w: .14,  h: .06,  hitW: .11,  hitH: .042, height: 28 },
        { type: "rock",  x: .83, y: .62, w: .085, h: .07,  hitW: .058, hitH: .044, height: 30 }
      ];

      const trees = [
        { x: .025, y: .68, scale: 1.18 },
        { x: .105, y: .57, scale: .80 },
        { x: .30, y: .535, scale: .60 },
        { x: .70, y: .535, scale: .60 },
        { x: .895, y: .57, scale: .82 },
        { x: .98, y: .68, scale: 1.20 }
      ];

      const birds = Array.from({ length: 10 }, (_, i) => ({
        x: Math.random(),
        y: .12 + Math.random() * .23,
        speed: .014 + Math.random() * .025,
        phase: Math.random() * Math.PI * 2,
        size: 3 + Math.random() * 3,
        direction: i % 2 ? 1 : -1
      }));

      const player = {
        x: 0,
        y: 0,
        jumpZ: 0,
        jumpVelocity: 0,
        facing: 1,
        grounded: true
      };

      const keys = new Set();
      let width = 0;
      let height = 0;
      let pixelRatio = 1;
      let previousTime = 0;
      let activated = false;

      function groundY() {
        return height * .88;
      }

      function playerScale() {
        const far = height * .47;
        const near = height * .88;
        const depth = Math.max(0, Math.min(1, (player.y - far) / (near - far)));
        return .34 + depth * .66;
      }

      function avatarSize() {
        const h = Math.min(height * .22, 178) * playerScale();
        const aspect = avatar.naturalWidth && avatar.naturalHeight
          ? avatar.naturalWidth / avatar.naturalHeight
          : .72;
        return { w: h * aspect, h };
      }

      function resize() {
        const rect = canvas.getBoundingClientRect();
        width = rect.width;
        height = rect.height;
        pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.round(width * pixelRatio);
        canvas.height = Math.round(height * pixelRatio);
        ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

        if (!player.x) {
          player.x = width * .5;
          player.y = groundY();
        } else {
          player.x = Math.max(12, Math.min(width - 12, player.x));
          player.y = Math.max(height * .47, Math.min(groundY(), player.y));
        }
      }

      window.addEventListener("resize", resize);
      resize();

      function playSound(sound) {
        sound.currentTime = 0;
        sound.play().catch(error => {
          console.error("Audio could not play:", sound.src, error);
        });
      }

      function jump() {
        if (activated || !player.grounded) return;
        player.jumpVelocity = Math.max(470, height * .82);
        player.grounded = false;
        playSound(jumpSound);
      }

      function blocked(x, y) {
        const radius = Math.max(7, avatarSize().w * .11);

        for (const item of obstacles) {
          if (player.jumpZ > item.height) continue;

          const cx = width * item.x;
          const cy = height * item.y;
          const halfW = width * item.hitW / 2;
          const halfH = height * item.hitH / 2;
          const nearX = Math.max(cx - halfW, Math.min(x, cx + halfW));
          const nearY = Math.max(cy - halfH, Math.min(y, cy + halfH));
          const dx = x - nearX;
          const dy = y - nearY;

          if (dx * dx + dy * dy < radius * radius) return true;
        }

        return false;
      }

      function move(dx, dy) {
        const nx = Math.max(12, Math.min(width - 12, player.x + dx));
        if (!blocked(nx, player.y)) player.x = nx;

        const ny = Math.max(height * .47, Math.min(groundY(), player.y + dy));
        if (!blocked(player.x, ny)) player.y = ny;
      }

      function activate(destination) {
        if (activated) return;
        activated = true;
        keys.clear();
        status.textContent = `Opening ${destination.label}…`;
        playSound(decisionSound);

        setTimeout(() => {
          window.location.href = links[destination.id];
        }, 450);
      }

      function checkDestinationContact() {
        if (activated) return;

        const size = avatarSize();
        const centerY = player.y - player.jumpZ - size.h * .52;

        for (const destination of destinations) {
          const x = width * destination.x;
          const baseY = height * destination.y;
          const radius = Math.max(17, Math.min(25, height * .034));
          const emblemY = baseY - radius - 10;

          if (
            Math.abs(player.x - x) < radius + size.w * .28 &&
            Math.abs(centerY - emblemY) < radius + size.h * .34
          ) {
            activate(destination);
            return;
          }
        }
      }

      function roundedBox(x, y, w, h, r) {
        const radius = Math.min(r, w / 2, h / 2);
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + w, y, x + w, y + h, radius);
        ctx.arcTo(x + w, y + h, x, y + h, radius);
        ctx.arcTo(x, y + h, x, y, radius);
        ctx.arcTo(x, y, x + w, y, radius);
        ctx.closePath();
      }

      function drawBackground() {
        const sky = ctx.createLinearGradient(0, 0, 0, height);
        sky.addColorStop(0, "#9bb9ad");
        sky.addColorStop(.35, "#c0c9a8");
        sky.addColorStop(.55, "#70865b");
        sky.addColorStop(1, "#1c3424");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, width, height);

        const sun = ctx.createRadialGradient(
          width * .52, height * .20, 2,
          width * .52, height * .20, height * .64
        );
        sun.addColorStop(0, "rgba(255, 235, 181, .48)");
        sun.addColorStop(.42, "rgba(245, 224, 172, .13)");
        sun.addColorStop(1, "rgba(245, 224, 172, 0)");
        ctx.fillStyle = sun;
        ctx.fillRect(0, 0, width, height);

        // Distant hills.
        ctx.fillStyle = "#81916c";
        ctx.beginPath();
        ctx.moveTo(0, height * .44);
        ctx.quadraticCurveTo(width * .18, height * .29, width * .39, height * .42);
        ctx.quadraticCurveTo(width * .69, height * .24, width, height * .40);
        ctx.lineTo(width, height * .63);
        ctx.lineTo(0, height * .63);
        ctx.closePath();
        ctx.fill();

        // Closer hills.
        ctx.fillStyle = "#5b7655";
        ctx.beginPath();
        ctx.moveTo(0, height * .50);
        ctx.quadraticCurveTo(width * .20, height * .37, width * .43, height * .49);
        ctx.quadraticCurveTo(width * .74, height * .34, width, height * .47);
        ctx.lineTo(width, height * .69);
        ctx.lineTo(0, height * .69);
        ctx.closePath();
        ctx.fill();

        // Pond, bank, and water reflections.
        ctx.fillStyle = "#354f3c";
        ctx.beginPath();
        ctx.ellipse(width * .12, height * .62, width * .23, height * .105, -.06, 0, Math.PI * 2);
        ctx.fill();

        const water = ctx.createLinearGradient(0, height * .54, 0, height * .68);
        water.addColorStop(0, "#83a99b");
        water.addColorStop(.55, "#527d77");
        water.addColorStop(1, "#315953");
        ctx.fillStyle = water;
        ctx.beginPath();
        ctx.ellipse(width * .12, height * .61, width * .205, height * .077, -.06, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "rgba(238, 246, 220, .46)";
        ctx.lineWidth = 1;
        for (let i = 0; i < 8; i++) {
          const x = width * (.02 + i * .027);
          const y = height * (.58 + (i % 3) * .022);
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.quadraticCurveTo(x + 10, y - 2, x + 22, y);
          ctx.stroke();
        }

        // Forest ground.
        const ground = ctx.createLinearGradient(0, height * .46, 0, height);
        ground.addColorStop(0, "#59744a");
        ground.addColorStop(.36, "#3b5936");
        ground.addColorStop(1, "#172c20");
        ctx.fillStyle = ground;
        ctx.fillRect(0, height * .46, width, height * .54);

        // Perspective path.
        ctx.fillStyle = "#a49a7a";
        ctx.beginPath();
        ctx.moveTo(width * .475, height * .45);
        ctx.lineTo(width * .525, height * .45);
        ctx.lineTo(width * .89, height);
        ctx.lineTo(width * .11, height);
        ctx.closePath();
        ctx.fill();

        const pathShade = ctx.createLinearGradient(0, height * .45, 0, height);
        pathShade.addColorStop(0, "rgba(244, 230, 190, .30)");
        pathShade.addColorStop(1, "rgba(65, 60, 44, .27)");
        ctx.fillStyle = pathShade;
        ctx.fill();

        // Stones increase in size toward the foreground.
        for (let i = 1; i < 20; i++) {
          const t = i / 21;
          const y = height * (.47 + t * .50);
          const x = width * (.5 + Math.sin(i * 4.7) * t * .18);
          const size = Math.max(2, width * (.003 + t * .009));
          ctx.fillStyle = i % 2 ? "rgba(60, 67, 52, .45)" : "rgba(226, 213, 176, .42)";
          ctx.beginPath();
          ctx.ellipse(x, y, size, size * .34, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawHill(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x - w / 2, y + h);
        ctx.quadraticCurveTo(x - w * .38, y + h * .14, x, y);
        ctx.quadraticCurveTo(x + w * .32, y - h * .08, x + w / 2, y + h);
        ctx.closePath();
        ctx.fill();

        ctx.strokeStyle = "rgba(180, 195, 129, .42)";
        ctx.lineWidth = Math.max(2, h * .07);
        ctx.beginPath();
        ctx.moveTo(x - w * .28, y + h * .55);
        ctx.quadraticCurveTo(x, y + h * .08, x + w * .28, y + h * .28);
        ctx.stroke();
      }

      function drawTree(tree) {
        const x = width * tree.x;
        const baseY = height * tree.y;
        const s = tree.scale;
        const trunkW = 18 * s;
        const trunkH = height * .29 * s;
        const topY = baseY - trunkH;

        const trunk = ctx.createLinearGradient(x - trunkW, 0, x + trunkW, 0);
        trunk.addColorStop(0, "#302d22");
        trunk.addColorStop(.45, "#756044");
        trunk.addColorStop(1, "#302c22");
        ctx.fillStyle = trunk;
        ctx.beginPath();
        ctx.moveTo(x - trunkW * .5, baseY);
        ctx.lineTo(x - trunkW * .28, topY);
        ctx.lineTo(x + trunkW * .22, topY);
        ctx.lineTo(x + trunkW * .65, baseY);
        ctx.closePath();
        ctx.fill();

        const leaves = ["#263f2e", "#34553a", "#456643", "#526d46"];
        for (let i = 0; i < 6; i++) {
          ctx.fillStyle = leaves[i % leaves.length];
          ctx.beginPath();
          ctx.ellipse(
            x + (i - 2.5) * 24 * s,
            topY - 28 * s + Math.sin(i * 2.4) * 12 * s,
            38 * s, 47 * s, 0, 0, Math.PI * 2
          );
          ctx.fill();
        }

        ctx.fillStyle = "rgba(190, 197, 125, .24)";
        ctx.beginPath();
        ctx.ellipse(x - 25 * s, topY - 54 * s, 20 * s, 9 * s, -.5, 0, Math.PI * 2);
        ctx.ellipse(x + 10 * s, topY - 35 * s, 16 * s, 7 * s, .4, 0, Math.PI * 2);
        ctx.fill();
      }

      function drawBirds(time) {
        for (const bird of birds) {
          const x = (((bird.x + time * bird.speed * bird.direction) % 1) + 1) % 1 * width;
          const y = height * bird.y + Math.sin(time * 2 + bird.phase) * 5;
          const flap = Math.sin(time * 8 + bird.phase) * bird.size;

          ctx.strokeStyle = "rgba(34, 47, 37, .85)";
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(x - bird.size, y);
          ctx.quadraticCurveTo(x, y - flap, x + bird.size, y);
          ctx.stroke();
        }
      }

      function drawObstacle(item) {
        const x = width * item.x;
        const y = height * item.y;
        const w = width * item.w;
        const h = height * item.h;

        ctx.fillStyle = "rgba(8, 17, 10, .45)";
        ctx.beginPath();
        ctx.ellipse(x + w * .08, y + h * .42, w * .62, h * .27, 0, 0, Math.PI * 2);
        ctx.fill();

        if (item.type === "rock") {
          const rock = ctx.createLinearGradient(x - w / 2, y, x + w / 2, y + h);
          rock.addColorStop(0, "#c0c4aa");
          rock.addColorStop(.4, "#818b75");
          rock.addColorStop(1, "#414f40");
          ctx.fillStyle = rock;
          ctx.beginPath();
          ctx.moveTo(x - w * .50, y + h * .70);
          ctx.lineTo(x - w * .42, y + h * .30);
          ctx.lineTo(x - w * .12, y + h * .04);
          ctx.lineTo(x + w * .18, y);
          ctx.lineTo(x + w * .44, y + h * .2);
          ctx.lineTo(x + w * .50, y + h * .66);
          ctx.lineTo(x + w * .30, y + h);
          ctx.lineTo(x - w * .37, y + h);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = "rgba(244, 243, 212, .4)";
          ctx.beginPath();
          ctx.moveTo(x - w * .34, y + h * .34);
          ctx.lineTo(x - w * .10, y + h * .08);
          ctx.lineTo(x + w * .15, y + h * .09);
          ctx.lineTo(x - w * .02, y + h * .42);
          ctx.closePath();
          ctx.fill();
        } else if (item.type === "stump") {
          ctx.fillStyle = "#684a31";
          ctx.fillRect(x - w * .34, y + h * .18, w * .68, h * .82);
          ctx.fillStyle = "#bd915c";
          ctx.beginPath();
          ctx.ellipse(x, y + h * .2, w * .48, h * .19, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "#684b30";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.ellipse(x, y + h * .2, w * .27, h * .09, 0, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.fillStyle = "#67492f";
          ctx.beginPath();
          ctx.ellipse(x, y + h * .52, w * .5, h * .34, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = "rgba(200, 156, 99, .9)";
          ctx.lineWidth = Math.max(2, h * .07);
          ctx.beginPath();
          ctx.moveTo(x - w * .30, y + h * .36);
          ctx.lineTo(x + w * .35, y + h * .36);
          ctx.moveTo(x - w * .22, y + h * .62);
          ctx.lineTo(x + w * .37, y + h * .62);
          ctx.stroke();
          ctx.fillStyle = "#b68b57";
          ctx.beginPath();
          ctx.ellipse(x - w * .44, y + h * .52, h * .23, h * .34, 0, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      function drawDestination(item) {
        const x = width * item.x;
        const baseY = height * item.y;
        const scale = Math.max(.68, Math.min(1, height / 720));
        const radius = 23 * scale;
        const bubbleY = baseY - radius - 10 * scale;

        ctx.fillStyle = "rgba(12, 22, 14, .4)";
        ctx.beginPath();
        ctx.ellipse(x, baseY + 2, 20 * scale, 6 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#604a32";
        ctx.lineWidth = 5 * scale;
        ctx.beginPath();
        ctx.moveTo(x, bubbleY + radius * .7);
        ctx.lineTo(x, baseY);
        ctx.stroke();

        ctx.shadowColor = item.color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = "#233b2b";
        ctx.strokeStyle = item.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(x, bubbleY, radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;

        ctx.fillStyle = item.color;
        ctx.font = `bold ${20 * scale}px system-ui`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(item.icon, x, bubbleY);

        ctx.font = `600 ${Math.max(10, 11 * scale)}px system-ui`;
        const labelWidth = Math.max(64 * scale, ctx.measureText(item.label).width + 18);
        roundedBox(x - labelWidth / 2, bubbleY + radius + 5, labelWidth, 20 * scale, 7);
        ctx.fillStyle = "rgba(20, 37, 26, .95)";
        ctx.fill();
        ctx.fillStyle = "#f3f1df";
        ctx.fillText(item.label, x, bubbleY + radius + 15 * scale);
      }

      function drawCharacter(time) {
        const size = avatarSize();
        const moving = keys.size > 0;
        const bob = player.grounded && moving ? Math.abs(Math.sin(time * 11)) * 2 : 0;
        const drawY = player.y - player.jumpZ + bob;

        ctx.fillStyle = `rgba(10, 20, 13, ${Math.max(.1, .34 - player.jumpZ / 700)})`;
        ctx.beginPath();
        ctx.ellipse(
          player.x,
          player.y + 2,
          Math.max(9, size.w * .24) * (1 + player.jumpZ / 250),
          Math.max(3, size.h * .045),
          0, 0, Math.PI * 2
        );
        ctx.fill();

        if (!avatar.complete || !avatar.naturalWidth) {
          ctx.fillStyle = "#252832";
          ctx.beginPath();
          ctx.ellipse(player.x, drawY - size.h * .48, Math.max(12, size.w * .3), Math.max(18, size.h * .48), 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#ecc19e";
          ctx.beginPath();
          ctx.arc(player.x, drawY - size.h * .84, Math.max(6, size.w * .18), 0, Math.PI * 2);
          ctx.fill();
          return;
        }

        ctx.save();
        ctx.translate(player.x, drawY);
        ctx.scale(player.facing, 1);
        ctx.drawImage(avatar, -size.w / 2, -size.h, size.w, size.h);
        ctx.restore();
      }

      function drawForeground() {
        // Small side foliage leaves the central path unobstructed.
        ctx.fillStyle = "rgba(10, 27, 16, .72)";
        ctx.beginPath();
        ctx.moveTo(0, height);
        ctx.lineTo(0, height * .82);
        ctx.quadraticCurveTo(width * .045, height * .84, width * .12, height);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(width, height);
        ctx.lineTo(width, height * .81);
        ctx.quadraticCurveTo(width * .95, height * .84, width * .88, height);
        ctx.closePath();
        ctx.fill();

        const vignette = ctx.createRadialGradient(
          width * .5, height * .48, height * .18,
          width * .5, height * .48, Math.max(width, height) * .8
        );
        vignette.addColorStop(0, "rgba(0,0,0,0)");
        vignette.addColorStop(1, "rgba(5,15,9,.28)");
        ctx.fillStyle = vignette;
        ctx.fillRect(0, 0, width, height);
      }

      function drawScene(time) {
        // Clear first so no old frame or fallback background can cover the scene.
        ctx.clearRect(0, 0, width, height);
        drawBackground();
        drawBirds(time);
        drawHill(width * .18, height * .48, width * .30, height * .13, "#496444");
        drawHill(width * .83, height * .47, width * .34, height * .16, "#3e5b3b");

        const objects = [];
        for (const tree of trees) {
          objects.push({ y: height * tree.y, draw: () => drawTree(tree) });
        }
        for (const destination of destinations) {
          objects.push({ y: height * destination.y, draw: () => drawDestination(destination) });
        }
        for (const obstacle of obstacles) {
          objects.push({ y: height * obstacle.y, draw: () => drawObstacle(obstacle) });
        }

        objects.sort((a, b) => a.y - b.y);

        let playerWasDrawn = false;
        for (const object of objects) {
          if (!playerWasDrawn && object.y > player.y) {
            drawCharacter(time);
            playerWasDrawn = true;
          }
          object.draw();
        }

        if (!playerWasDrawn) drawCharacter(time);
        drawForeground();
      }

      function update(delta) {
        if (activated) return;

        let dx = 0;
        let dy = 0;
        if (keys.has("left")) dx -= 1;
        if (keys.has("right")) dx += 1;
        if (keys.has("up")) dy -= 1;
        if (keys.has("down")) dy += 1;

        if (dx || dy) {
          const length = Math.hypot(dx, dy);
          const speed = 190 * delta;
          move(dx / length * speed, dy / length * speed);
          if (dx) player.facing = dx < 0 ? -1 : 1;
        }

        if (!player.grounded) {
          player.jumpVelocity -= Math.max(1000, height * 1.8) * delta;
          player.jumpZ += player.jumpVelocity * delta;

          if (player.jumpZ <= 0) {
            player.jumpZ = 0;
            player.jumpVelocity = 0;
            player.grounded = true;
          }
        }

        checkDestinationContact();
      }

      function checkDestinationContact() {
        if (activated) return;

        const size = avatarSize();
        const centerY = player.y - player.jumpZ - size.h * .52;

        for (const destination of destinations) {
          const x = width * destination.x;
          const bubbleY = height * destination.y - 33;
          const reachX = 25 + size.w * .28;
          const reachY = 25 + size.h * .34;

          if (Math.abs(player.x - x) < reachX && Math.abs(centerY - bubbleY) < reachY) {
            activate(destination);
            return;
          }
        }
      }

      const keyMap = {
        ArrowLeft: "left", KeyA: "left",
        ArrowRight: "right", KeyD: "right",
        ArrowUp: "up", KeyW: "up",
        ArrowDown: "down", KeyS: "down"
      };

      window.addEventListener("keydown", event => {
        if (event.code === "Space") {
          event.preventDefault();
          if (!event.repeat) jump();
          return;
        }

        const direction = keyMap[event.code];
        if (!direction) return;

        event.preventDefault();
        keys.add(direction);
      });

      window.addEventListener("keyup", event => {
        const direction = keyMap[event.code];
        if (direction) keys.delete(direction);
      });

      window.addEventListener("blur", () => keys.clear());

      document.querySelectorAll(".control-btn").forEach(button => {
        const direction = button.dataset.dir;

        button.addEventListener("pointerdown", event => {
          event.preventDefault();
          button.classList.add("active");
          button.setPointerCapture(event.pointerId);

          if (direction === "jump") {
            jump();
          } else {
            keys.add(direction);
          }
        });

        function stop(event) {
          event.preventDefault();
          button.classList.remove("active");
          if (direction !== "jump") keys.delete(direction);
        }

        button.addEventListener("pointerup", stop);
        button.addEventListener("pointercancel", stop);
        button.addEventListener("lostpointercapture", stop);
      });

      function frame(timeMs) {
        const time = timeMs / 1000;
        const delta = Math.min(.04, previousTime ? (timeMs - previousTime) / 1000 : 0);
        previousTime = timeMs;

        try {
          update(delta);
          drawScene(time);
        } catch (error) {
          console.error("Sanctuary rendering error:", error);
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.fillStyle = "#24382a";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          status.textContent = "Scene error — open the browser console and check the first red message.";
        }

        requestAnimationFrame(frame);
      }

      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
