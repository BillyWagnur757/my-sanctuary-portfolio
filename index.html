<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BillyWagnur Bird Sanctuary</title>
  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #172d22;
      color: white;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    #scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .hud, .status, .quick-nav {
      position: absolute;
      background: rgba(15, 36, 27, .82);
      border: 1px solid rgba(220, 239, 209, .4);
      box-shadow: 0 8px 30px rgba(0, 0, 0, .3);
      backdrop-filter: blur(8px);
    }

    .hud {
      top: 16px;
      left: 16px;
      max-width: calc(100% - 32px);
      padding: 12px 16px;
      border-radius: 14px;
      pointer-events: none;
    }

    .hud h1 {
      margin: 0 0 4px;
      color: #d3e9b9;
      font-size: 1rem;
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .hud p {
      margin: 0;
      font-size: .82rem;
    }

    .status {
      top: 16px;
      right: 16px;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: .82rem;
      pointer-events: none;
    }

    .quick-nav {
      left: 50%;
      bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      gap: 8px;
      max-width: calc(100% - 24px);
      padding: 9px;
      border-radius: 16px;
      transform: translateX(-50%);
      overflow-x: auto;
    }

    .nav-btn {
      flex: 0 0 auto;
      padding: 9px 13px;
      border: 1px solid rgba(220, 239, 209, .45);
      border-radius: 999px;
      background: #294a38;
      color: white;
      font: inherit;
      font-size: .82rem;
      font-weight: 650;
      cursor: pointer;
    }

    .nav-btn:hover, .nav-btn:focus-visible {
      background: #54784d;
      outline: 2px solid #d3e9b9;
      outline-offset: 2px;
    }

    .dpad {
      position: absolute;
      right: 16px;
      bottom: 82px;
      display: none;
      width: 132px;
      height: 132px;
      touch-action: none;
    }

    .dpad button {
      position: absolute;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(230, 242, 217, .7);
      border-radius: 12px;
      background: rgba(37, 72, 52, .82);
      color: white;
      font-size: 1.15rem;
      touch-action: none;
      user-select: none;
    }

    .dpad [data-dir="up"] { top: 0; left: 44px; }
    .dpad [data-dir="down"] { bottom: 0; left: 44px; }
    .dpad [data-dir="left"] { top: 44px; left: 0; }
    .dpad [data-dir="right"] { top: 44px; right: 0; }

    @media (max-width: 650px) {
      .dpad { display: block; }
      .hud { top: 10px; left: 10px; padding: 10px 12px; }
      .hud h1 { font-size: .88rem; }
      .hud p { font-size: .73rem; }

      .status {
        top: 82px;
        right: 10px;
        max-width: 55%;
        padding: 8px 10px;
        font-size: .73rem;
      }

      .nav-btn { padding: 8px 11px; font-size: .75rem; }
    }
  </style>
</head>
<body>
  <main id="scene">
    <canvas id="world" aria-label="Bird sanctuary. Select a destination to walk there."></canvas>

    <header class="hud">
      <h1>BillyWagnur Sanctuary</h1>
      <p>Use WASD or arrow keys to explore, or select a destination.</p>
    </header>

    <div class="status" id="status" aria-live="polite">
      A quiet morning in the sanctuary
    </div>

    <nav class="quick-nav" aria-label="Destinations">
      <button class="nav-btn" data-station="youtube">YouTube</button>
      <button class="nav-btn" data-station="spotify">Spotify</button>
      <button class="nav-btn" data-station="applemusic">Apple Music</button>
      <button class="nav-btn" data-station="tiktok">TikTok</button>
    </nav>

    <div class="dpad" aria-label="Movement controls">
      <button type="button" data-dir="up" aria-label="Walk up">▲</button>
      <button type="button" data-dir="down" aria-label="Walk down">▼</button>
      <button type="button" data-dir="left" aria-label="Walk left">◀</button>
      <button type="button" data-dir="right" aria-label="Walk right">▶</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById("world");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    const destinations = {
      youtube: "https://www.youtube.com/@NemoBilly757",
      spotify: "https://open.spotify.com/artist/4zVX7y6mrklcuGHDJjZ12e?si=gbSGtZBuQjWSURHQCDtU3g",
      applemusic: "https://music.apple.com/us/artist/billywagnur/1584479650",
      tiktok: "https://www.tiktok.com/@baggettball"
    };

    // Keep avatar.png and aye.mp3 in the same folder as this index.html file.
    const avatar = new Image();
    avatar.src = "./avatar.png";

    const decisionSound = new Audio("./aye.mp3");
    decisionSound.preload = "auto";

    const stations = [
      { id: "youtube", label: "YouTube", icon: "▶", color: "#e76b58", x: .20, y: .49 },
      { id: "spotify", label: "Spotify", icon: "♫", color: "#9fc27e", x: .40, y: .43 },
      { id: "applemusic", label: "Apple Music", icon: "♫", color: "#e99b9c", x: .60, y: .43 },
      { id: "tiktok", label: "TikTok", icon: "♪", color: "#8bc5c0", x: .80, y: .49 }
    ];

    const player = { x: 0, y: 0, facing: 1 };
    const keys = new Set();

    let width = 0;
    let height = 0;
    let pixelRatio = 1;
    let targetStation = null;
    let previousTime = 0;
    let navigationTimer = null;

    const birds = Array.from({ length: 9 }, (_, i) => ({
      x: Math.random(),
      y: .12 + Math.random() * .24,
      speed: .014 + Math.random() * .025,
      phase: Math.random() * Math.PI * 2,
      size: 3 + Math.random() * 3,
      direction: i % 2 ? 1 : -1
    }));

    function resize() {
      const rect = canvas.getBoundingClientRect();
      width = rect.width;
      height = rect.height;
      pixelRatio = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      if (!player.x) {
        player.x = width * .5;
        player.y = height * .78;
      } else {
        player.x = Math.min(width - 20, player.x);
        player.y = Math.min(height - 60, player.y);
      }
    }

    window.addEventListener("resize", resize);
    resize();

    function pointFor(station) {
      return { x: width * station.x, y: height * station.y };
    }

    function walkTo(station) {
      if (!station) return;

      if (navigationTimer) {
        clearTimeout(navigationTimer);
        navigationTimer = null;
      }

      targetStation = station;
      keys.clear();
      statusEl.textContent = `Walking to ${station.label}…`;

      decisionSound.currentTime = 0;
      decisionSound.play().catch(error => {
        console.warn("Could not play aye.mp3:", error);
      });
    }

    document.querySelectorAll(".nav-btn").forEach(button => {
      button.addEventListener("click", () => {
        const station = stations.find(item => item.id === button.dataset.station);
        walkTo(station);
      });
    });

    const keyDirections = {
      ArrowUp: "up", KeyW: "up",
      ArrowDown: "down", KeyS: "down",
      ArrowLeft: "left", KeyA: "left",
      ArrowRight: "right", KeyD: "right"
    };

    window.addEventListener("keydown", event => {
      const direction = keyDirections[event.code];
      if (!direction) return;

      event.preventDefault();
      keys.add(direction);
      targetStation = null;

      if (navigationTimer) {
        clearTimeout(navigationTimer);
        navigationTimer = null;
      }

      statusEl.textContent = "Exploring the sanctuary";
    });

    window.addEventListener("keyup", event => {
      const direction = keyDirections[event.code];
      if (direction) keys.delete(direction);
    });

    window.addEventListener("blur", () => keys.clear());

    document.querySelectorAll(".dpad button").forEach(button => {
      const direction = button.dataset.dir;

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys.add(direction);
        targetStation = null;

        if (navigationTimer) {
          clearTimeout(navigationTimer);
          navigationTimer = null;
        }

        button.setPointerCapture(event.pointerId);
        statusEl.textContent = "Exploring the sanctuary";
      });

      const stop = event => {
        event.preventDefault();
        keys.delete(direction);
      };

      button.addEventListener("pointerup", stop);
      button.addEventListener("pointercancel", stop);
      button.addEventListener("lostpointercapture", stop);
    });

    canvas.addEventListener("click", event => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const clickedStation = stations.find(station => {
        const point = pointFor(station);
        return Math.hypot(x - point.x, y - point.y) < Math.max(34, width * .04);
      });

      if (clickedStation) walkTo(clickedStation);
    });

    function drawBackground() {
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, "#9ab9ae");
      sky.addColorStop(.33, "#b8c6a5");
      sky.addColorStop(.53, "#526d4d");
      sky.addColorStop(1, "#172d22");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      const sunlight = ctx.createRadialGradient(
        width * .5, height * .2, 5,
        width * .5, height * .2, height * .6
      );
      sunlight.addColorStop(0, "rgba(244, 224, 169, .32)");
      sunlight.addColorStop(1, "rgba(244, 224, 169, 0)");
      ctx.fillStyle = sunlight;
      ctx.fillRect(0, 0, width, height);

      // Distant hills.
      ctx.fillStyle = "#526d54";
      ctx.beginPath();
      ctx.moveTo(0, height * .45);
      ctx.quadraticCurveTo(width * .24, height * .28, width * .47, height * .43);
      ctx.quadraticCurveTo(width * .72, height * .27, width, height * .42);
      ctx.lineTo(width, height * .58);
      ctx.lineTo(0, height * .58);
      ctx.fill();

      // Pond and water.
      ctx.fillStyle = "#375943";
      ctx.beginPath();
      ctx.ellipse(width * .12, height * .60, width * .22, height * .10, -.06, 0, Math.PI * 2);
      ctx.fill();

      const pond = ctx.createLinearGradient(0, height * .52, 0, height * .68);
      pond.addColorStop(0, "#6f9b91");
      pond.addColorStop(1, "#284d4b");
      ctx.fillStyle = pond;
      ctx.beginPath();
      ctx.ellipse(width * .12, height * .59, width * .195, height * .075, -.06, 0, Math.PI * 2);
      ctx.fill();

      // Forest floor.
      const ground = ctx.createLinearGradient(0, height * .43, 0, height);
      ground.addColorStop(0, "#425c3b");
      ground.addColorStop(1, "#172d22");
      ctx.fillStyle = ground;
      ctx.fillRect(0, height * .43, width, height * .57);

      // Perspective path.
      ctx.fillStyle = "#9c9275";
      ctx.beginPath();
      ctx.moveTo(width * .46, height * .43);
      ctx.lineTo(width * .54, height * .43);
      ctx.lineTo(width * .83, height);
      ctx.lineTo(width * .17, height);
      ctx.closePath();
      ctx.fill();

      // Path stones.
      for (let i = 1; i < 17; i++) {
        const t = i / 18;
        const y = height * (.45 + t * .5);
        const x = width * (.5 + Math.sin(i * 4.7) * t * .19);
        const size = Math.max(3, width * (.005 + t * .01));

        ctx.fillStyle = i % 2
          ? "rgba(61, 66, 51, .42)"
          : "rgba(221, 207, 165, .34)";

        ctx.beginPath();
        ctx.ellipse(x, y, size, size * .35, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawTree(x, groundY, scale) {
      const trunkWidth = 19 * scale;
      const trunkHeight = height * .30 * scale;
      const top = groundY - trunkHeight;

      const trunk = ctx.createLinearGradient(x - trunkWidth, 0, x + trunkWidth, 0);
      trunk.addColorStop(0, "#302d22");
      trunk.addColorStop(.5, "#62533a");
      trunk.addColorStop(1, "#332f24");
      ctx.fillStyle = trunk;

      ctx.beginPath();
      ctx.moveTo(x - trunkWidth * .4, groundY);
      ctx.lineTo(x - trunkWidth * .25, top);
      ctx.lineTo(x + trunkWidth * .25, top);
      ctx.lineTo(x + trunkWidth * .6, groundY);
      ctx.closePath();
      ctx.fill();

      const colors = ["#294632", "#38583b", "#456542"];

      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = colors[i % colors.length];
        ctx.beginPath();
        ctx.ellipse(
          x + (i - 2) * 23 * scale,
          top - 30 * scale + Math.sin(i * 2.4) * 10 * scale,
          36 * scale,
          45 * scale,
          0,
          0,
          Math.PI * 2
        );
        ctx.fill();
      }
    }

    function drawTrees() {
      [
        [-.02, .64, 1.4], [.10, .55, .82], [.25, .51, .56],
        [.98, .62, 1.4], [.88, .54, .82], [.75, .50, .56],
        [.34, .48, .4], [.67, .48, .4]
      ].forEach(([x, y, scale]) => {
        drawTree(width * x, height * y, scale);
      });
    }

    function drawBirds(time) {
      birds.forEach(bird => {
        const x = (((bird.x + time * bird.speed * bird.direction) % 1) + 1) % 1 * width;
        const y = height * bird.y + Math.sin(time * 2 + bird.phase) * 5;
        const flap = Math.sin(time * 8 + bird.phase) * bird.size;

        ctx.strokeStyle = "rgba(35, 48, 39, .8)";
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x - bird.size, y);
        ctx.quadraticCurveTo(x, y - flap, x + bird.size, y);
        ctx.stroke();
      });
    }

    function drawStation(station) {
      const { x, y } = pointFor(station);
      const scale = Math.max(.7, Math.min(1, height / 720));
      const radius = 23 * scale;

      // Signpost.
      ctx.strokeStyle = "#544a35";
      ctx.lineWidth = 5 * scale;
      ctx.beginPath();
      ctx.moveTo(x, y + 14 * scale);
      ctx.lineTo(x, y + 42 * scale);
      ctx.stroke();

      // Sign.
      ctx.fillStyle = "#253c2b";
      ctx.strokeStyle = station.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = station.color;
      ctx.font = `bold ${20 * scale}px system-ui`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(station.icon, x, y);

      ctx.font = `600 ${Math.max(10, 11 * scale)}px system-ui`;
      const labelWidth = Math.max(64 * scale, ctx.measureText(station.label).width + 18);

      ctx.fillStyle = "rgba(20, 37, 26, .88)";
      ctx.beginPath();
      ctx.roundRect(x - labelWidth / 2, y + radius + 5, labelWidth, 20 * scale, 7);
      ctx.fill();

      ctx.fillStyle = "#f3f1df";
      ctx.fillText(station.label, x, y + radius + 15 * scale);
    }

    function drawCharacter(time) {
      if (!avatar.complete || !avatar.naturalWidth) return;

      const moving = keys.size > 0 || targetStation !== null;
      const bob = moving ? Math.abs(Math.sin(time * 11)) * 2 : 0;
      const maxHeight = Math.min(height * .24, 190);
      const scale = maxHeight / avatar.naturalHeight;
      const spriteWidth = avatar.naturalWidth * scale;
      const spriteHeight = avatar.naturalHeight * scale;

      ctx.save();
      ctx.translate(player.x, player.y + bob);
      ctx.scale(player.facing, 1);
      ctx.drawImage(
        avatar,
        -spriteWidth / 2,
        -spriteHeight + 8,
        spriteWidth,
        spriteHeight
      );
      ctx.restore();
    }

    function update(delta) {
      let dx = 0;
      let dy = 0;

      if (targetStation) {
        const target = pointFor(targetStation);
        dx = target.x - player.x;
        dy = target.y + 43 - player.y;

        if (Math.hypot(dx, dy) < 10) {
          const arrived = targetStation;
          targetStation = null;
          statusEl.textContent = `Opening ${arrived.label}…`;

          navigationTimer = setTimeout(() => {
            window.location.href = destinations[arrived.id];
          }, 600);

          return;
        }
      } else {
        if (keys.has("left")) dx -= 1;
        if (keys.has("right")) dx += 1;
        if (keys.has("up")) dy -= 1;
        if (keys.has("down")) dy += 1;
      }

      if (dx || dy) {
        const length = Math.hypot(dx, dy);
        const speed = 155 * delta;

        player.x += dx / length * speed;
        player.y += dy / length * speed;

        if (dx) player.facing = dx < 0 ? -1 : 1;

        player.x = Math.max(22, Math.min(width - 22, player.x));
        player.y = Math.max(height * .30, Math.min(height - 60, player.y));
      }
    }

    function frame(timeMs) {
      const time = timeMs / 1000;
      const delta = Math.min(.04, previousTime ? (timeMs - previousTime) / 1000 : 0);
      previousTime = timeMs;

      update(delta);
      drawBackground();
      drawTrees();
      drawBirds(time);
      stations.forEach(drawStation);
      drawCharacter(time);

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  </script>
</body>
</html>
